[project]
name = "mini_llm"
version = "0.1.0"
description = "A 124M language model from raw text to a chat model: the pipeline, the evals and the inference, to learn from"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["torch", "tiktoken", "numpy", "tqdm"]

[project.optional-dependencies]
train = ["datasets"]
serve = ["fastapi", "uvicorn"]
export = ["transformers", "safetensors"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["mini_llm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
